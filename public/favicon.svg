<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="140" fill="url(#bg)"/>
  <!-- Specular Lens Glass Reflection -->
  <path d="M0,0 L512,0 L512,256 C300,200 200,200 0,256 Z" fill="url(#glass)"/>
  <!-- BCZ Text / Emblem -->
  <text x="50%" y="58%" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="190" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">BCZ</text>
  <!-- Diamond Crown Accent -->
  <polygon points="256,70 280,110 320,110 290,135 305,175 256,150 207,175 222,135 192,110 232,110" fill="#f59e0b"/>
</svg>
